<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存した3案の比較</title><link rel="stylesheet" href="/style.css"><script type="module" src="/review.js"></script></head><body><main>
<h1>保存した3案を比較</h1><p><a href="/">3案を作る</a> · <a href="/editor">写真エディター</a></p>
<p>同じ画像を後日も比較します。保存・記録・書き出しでAPIは呼びません。人の選択を記録する画面で、自動学習はしません。</p>
<label>保存セット <select id="sets"></select></label><button id="bundle" type="button">この組の画像付きJSONを保存</button><button id="next" type="button">次の未記録セットへ</button>
<label>画像付きJSONを読み込む <input id="import" type="file" accept="application/json,.json"></label><p>読み込みは画像セットのみです。許諾や人の評価を自動で取り込みません。画像付きJSONは非公開で扱ってください。</p>
<label>検証用の表示幅 <select id="width"><option>168</option><option>246</option><option selected>360</option></select></label>
<p id="status" role="status" aria-live="polite"></p><section id="review-images" aria-label="固定された3候補"></section>
<form id="review-form"><label>サンプルID（s001など）<input id="sample" required pattern="s[0-9]{3,}" maxlength="50"></label><label>評価者ID（r01など。氏名は不要）<input id="reviewer" required pattern="r[0-9]{2,}" maxlength="50"></label>
<label>出典 <select id="source" required><option value="">選んでください</option><option value="original">自分の動画・タイトル</option><option value="owner_material">所有者から提供されたもの</option><option value="synthetic">人工・練習用</option></select></label>
<label>出典URL（任意）<input id="source-url" type="url" maxlength="2000"></label><label>許諾 <select id="permission"><option value="none">未確認</option><option value="own_work">自分が権利を持つ</option><option value="owner_consented">所有者の許諾を得た</option></select></label><label>許諾確認日 <input id="permission-date" type="date"></label><label><input id="permission-confirmed" type="checkbox">出典と許諾を人が確認した</label>
<label>選択 <select id="decision" required><option value="">選んでください</option><option value="bold">bold</option><option value="contrast">contrast</option><option value="clean">clean</option><option value="none">どの案も使わない</option></select></label>
<label>全案の順位（任意）<select id="ranking"><option value="">未記録</option><option>bold&gt;contrast&gt;clean</option><option>bold&gt;clean&gt;contrast</option><option>contrast&gt;bold&gt;clean</option><option>contrast&gt;clean&gt;bold</option><option>clean&gt;bold&gt;contrast</option><option>clean&gt;contrast&gt;bold</option></select></label><label>理由<textarea id="reason" maxlength="1000"></textarea></label>
<label>改善が必要な主な項目 <select id="failure"><option value="none">特になし</option><option value="text">文字</option><option value="composition">構図</option><option value="material">素材</option><option value="other">その他</option></select></label>
<label>OS（例 Windows 11）<input id="os" required maxlength="100"></label><label>ブラウザ（例 Chrome、バージョン）<input id="browser" required maxlength="150"></label>
<label>この生成1回の実費（USD、請求画面で確認。未確認は空欄）<input id="cost" type="number" min="0" step="0.000001"></label><label>この組のPNGを保存できたか <select id="saved"><option value="unknown">未確認</option><option value="yes">保存できた</option><option value="no">保存できなかった</option></select></label>
<button id="save-review">人の比較を記録</button></form>
<h2>進み具合・集計</h2><p id="progress"></p><p>同じ組・評価者・表示幅で再記録すると更新します。20件は許諾確認済み・人工以外の異なるサンプル数です。holdoutは評価基準の調整に使いません。</p><pre id="summary"></pre>
<button id="export-report" type="button">記録と集計JSONを保存（画像なし）</button><button id="export-preferences" type="button">選択した表示幅のpreferences.csvを保存</button><button id="export-scores" type="button">選択した表示幅のscores.csvを保存</button><p id="export-note"></p>
</main></body></html>
