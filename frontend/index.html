<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サムネ工房 — MVP</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><span class="badge">2人開発 / MVP</span><h1>伝わるサムネを、<br>3つの案から。</h1><p>タイトルを入力して、配色と文字の見え方を比較。</p><aside id="mode">設定を確認しています。スコアはCTR予測ではありません。</aside><form id="form"><label for="title">動画タイトル</label><input id="title" required maxlength="120" value="AIでサムネ作りを変える"><label for="genre">ジャンル</label><select id="genre"><option value="education">学習・解説</option><option value="gaming">ゲーム</option><option value="vlog">Vlog</option><option value="other">その他</option></select><button id="submit">3案を作る</button></form><p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="サムネイル候補"></section><footer>保存形式: SVG / 1280 × 720　・　採点: 配色、文字数、文字サイズ</footer></main></body></html>
