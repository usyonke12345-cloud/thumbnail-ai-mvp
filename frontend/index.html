<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サムネ工房 — MVP</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><span class="badge">2人開発 / MVP</span><h1>写真からサムネを作る。</h1><p>写真・動画内容・見出しから、AIで完成画像を作ります。</p><p><a href="/editor">写真からAI完成画像を作る →</a></p><p><a href="/references">参考サムネの記録・基準づくり</a></p><h2>配色・文字配置の確認デモ</h2><p>下の3案は固定の構図です。実用的な候補がない場合は20件の比較を続けず、写真からのAI生成で品質を確認します。</p><aside id="mode">設定を確認しています。スコアはCTR予測ではありません。</aside><form id="form"><label for="title">動画タイトル</label><input id="title" required maxlength="120" value="AIでサムネ作りを変える"><label for="genre">ジャンル</label><select id="genre"><option value="education">学習・解説</option><option value="gaming">ゲーム</option><option value="vlog">Vlog</option><option value="other">その他</option></select><button id="submit">3案を作る</button></form><p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="サムネイル候補"></section><footer>保存形式: PNG・JPEG・SVG / 1280 × 720　・　レイアウト評価: コントラスト、文字数、文字サイズ、収まり（未評価の項目あり）</footer></main></body></html>
